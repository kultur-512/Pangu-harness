name: ci

# 测试 + 类型检查门（此前仓库只有分支保护 workflow，npm test 从不被 CI 执行）。
# 注：全量套件在 Windows 高并发下有已知进程级崩溃假象（CHANGELOG 0.7.3 记录），
# CI 用 --test-concurrency=4 + 失败自动重跑一次规避。

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: node --test --import tsx --test-concurrency=4 "tests/**/*.test.ts"

      - name: Retry test on known process-level flake
        if: failure()
        run: node --test --import tsx --test-concurrency=4 "tests/**/*.test.ts"
